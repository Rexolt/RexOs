<!DOCTYPE html><html><head><meta charset="utf-8"><title>DOM churn</title>
<style>body{font-family:sans-serif;font-size:14px;margin:8px}
.r{padding:3px 6px;margin:2px 0;background:#eef;border-left:4px solid #46a}</style></head>
<body><h2>Folyamatos DOM-modositas</h2><div id="host"></div>
<script>
/* Sűrű DOM-változás: minden 60 ms-ban ki-be pakolunk elemeket. A cél, hogy a
   dobozfa-újraépítés és a képernyő-újrarajzolás egymásba érjen. */
var host = document.getElementById("host"), n = 0;
setInterval(function(){
  n++;
  if (host.childNodes.length > 12) { host.innerHTML = ""; }
  var d = document.createElement("div");
  d.className = "r";
  d.textContent = "sor " + n + " - " + new Date().getTime();
  host.appendChild(d);
  document.body.className = (n % 2) ? "even" : "odd";
}, 60);
</script></body></html>
